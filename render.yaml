# Render Blueprint: deploys the backend API and the web version of the app.
# Set up once in the Render dashboard: New > Blueprint > pick this repo.
# Render asks for ROBOFLOW_API_KEY during setup; it is never stored in git.
services:
  # Backend API (Python). The phone app and website both call this.
  - type: web
    name: waste-sorter-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: ROBOFLOW_API_KEY
        sync: false
      # Optional, for nearest drop-off spots. Add it in the service's Environment tab.
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      # Optional, for the AI second opinion on unclear scans. Add it in the Environment tab.
      - key: GEMINI_API_KEY
        sync: false

  # Web version of the phone app: anyone can open it in a phone browser, no Expo Go needed.
  - type: web
    name: waste-sorter-web
    runtime: static
    rootDir: mobile
    buildCommand: npm ci && npx expo export --platform web
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Baked into the website at build time. Change it if the API's URL changes.
      - key: EXPO_PUBLIC_API_URL
        value: https://waste-sorter-api.onrender.com
